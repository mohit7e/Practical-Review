<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical Review — Document Correction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #111111;
            min-height: 100vh;
            line-height: 1.5;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            font-size: 28px;
            font-weight: 600;
            color: #111111;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 16px;
            color: #666666;
        }

        /* Upload Zone */
        .upload-zone {
            width: 100%;
            max-width: 560px;
            background: #fafafa;
            border: 2px dashed #dddddd;
            border-radius: 8px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-zone:hover {
            border-color: #111111;
            background: #f5f5f5;
        }

        .upload-zone.dragging {
            border-color: #111111;
            background: #f0f0f0;
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
        }

        .upload-icon svg {
            width: 100%;
            height: 100%;
            stroke: #666666;
            stroke-width: 1.5;
            fill: none;
        }

        .upload-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .upload-subtitle {
            color: #666666;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .upload-formats {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .format-badge {
            font-size: 12px;
            padding: 4px 10px;
            background: #eeeeee;
            border-radius: 4px;
            color: #666666;
        }

        .hidden { display: none !important; }

        /* Processing */
        .processing-container {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        .processing-card {
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            padding: 40px 24px;
        }

        .file-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background: #eeeeee;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-icon svg {
            width: 20px;
            height: 20px;
            stroke: #666666;
            stroke-width: 2;
            fill: none;
        }

        .file-details { text-align: left; }

        .file-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .file-size {
            font-size: 12px;
            color: #888888;
        }

        .spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 16px;
            border: 2px solid #eeeeee;
            border-top-color: #111111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .processing-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .processing-step {
            font-size: 14px;
            color: #666666;
        }

        .progress-container { margin-top: 20px; }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666666;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 4px;
            background: #eeeeee;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #111111;
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* Results */
        .results-container {
            width: 100%;
            max-width: 800px;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .results-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .success-icon {
            width: 24px;
            height: 24px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg {
            width: 14px;
            height: 14px;
            stroke: #2e7d32;
            stroke-width: 2.5;
            fill: none;
        }

        .results-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #111111;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #333333;
        }

        .btn-secondary {
            background: #ffffff;
            color: #111111;
            border: 1px solid #dddddd;
        }

        .btn-secondary:hover {
            background: #f5f5f5;
        }

        .btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .changes-summary {
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .summary-text {
            font-size: 14px;
            color: #444444;
        }

        .changes-list {
            background: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            overflow: hidden;
        }

        .changes-header {
            padding: 12px 16px;
            border-bottom: 1px solid #eeeeee;
            font-size: 12px;
            font-weight: 500;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .change-item {
            padding: 16px;
            border-bottom: 1px solid #eeeeee;
        }

        .change-item:last-child { border-bottom: none; }

        .change-type {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .change-type.spelling {
            background: #e3f2fd;
            color: #1565c0;
        }

        .change-type.grammar {
            background: #fff8e1;
            color: #f57f17;
        }

        .change-type.factual {
            background: #ffebee;
            color: #c62828;
        }

        .change-text {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .original {
            color: #999999;
            text-decoration: line-through;
            font-size: 14px;
        }

        .arrow { color: #999999; }

        .corrected {
            color: #2e7d32;
            font-size: 14px;
        }

        .change-explanation {
            font-size: 13px;
            color: #666666;
            font-style: italic;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        .preview-panel {
            background: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-header {
            padding: 12px 16px;
            border-bottom: 1px solid #eeeeee;
            font-size: 12px;
            font-weight: 500;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preview-content {
            padding: 16px;
            font-size: 13px;
            line-height: 1.6;
            color: #444444;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .preview-content.original-text { color: #888888; }
        .preview-content.corrected-text { color: #111111; }

        /* Error */
        .error-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .error-card {
            background: #ffffff;
            border: 1px solid #ffcdd2;
            border-radius: 8px;
            padding: 40px 24px;
        }

        .error-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            background: #ffebee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-icon svg {
            width: 24px;
            height: 24px;
            stroke: #c62828;
            stroke-width: 2;
            fill: none;
        }

        .error-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .error-message {
            color: #666666;
            margin-bottom: 24px;
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .app { padding: 32px 16px; }
            .preview-container { grid-template-columns: 1fr; }
            .results-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="logo">Practical Review</h1>
            <p class="tagline">AI-powered document correction for spelling, grammar, and accuracy</p>
        </header>

        <!-- Upload State -->
        <div id="uploadZone" class="upload-zone">
            <input type="file" id="fileInput" accept=".pdf,.xlsx,.docx,.txt" style="display: none;">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
            </div>
            <h2 class="upload-title">Drop your document here</h2>
            <p class="upload-subtitle">or click to browse</p>
            <div class="upload-formats">
                <span class="format-badge">PDF</span>
                <span class="format-badge">XLSX</span>
                <span class="format-badge">DOCX</span>
                <span class="format-badge">TXT</span>
            </div>
        </div>

        <!-- Processing State -->
        <div id="processingContainer" class="processing-container hidden">
            <div class="processing-card">
                <div class="file-info">
                    <div class="file-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                    </div>
                    <div class="file-details">
                        <div id="fileName" class="file-name">document.pdf</div>
                        <div id="fileSize" class="file-size">0 KB</div>
                    </div>
                </div>
                <div class="spinner"></div>
                <p class="processing-text">Processing document</p>
                <p id="processingStep" class="processing-step">Starting...</p>
                <div class="progress-container">
                    <div class="progress-label">
                        <span>Progress</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results State -->
        <div id="resultsContainer" class="results-container hidden">
            <div class="results-header">
                <h2 class="results-title">
                    <span class="success-icon">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </span>
                    Corrections Complete
                </h2>
                <div class="results-actions">
                    <button id="newFileBtn" class="btn btn-secondary">
                        <svg viewBox="0 0 24 24">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                        New File
                    </button>
                    <button id="downloadBtn" class="btn btn-primary">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download
                    </button>
                </div>
            </div>
            <div id="summarySection" class="changes-summary">
                <p id="summaryText" class="summary-text"></p>
            </div>
            <div id="changesList" class="changes-list"></div>
            <div class="preview-container">
                <div class="preview-panel">
                    <div class="preview-header">Original</div>
                    <div id="originalPreview" class="preview-content original-text"></div>
                </div>
                <div class="preview-panel">
                    <div class="preview-header">Corrected</div>
                    <div id="correctedPreview" class="preview-content corrected-text"></div>
                </div>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorContainer" class="error-container hidden">
            <div class="error-card">
                <div class="error-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <h2 class="error-title">Something went wrong</h2>
                <p id="errorMessage" class="error-message"></p>
                <button id="tryAgainBtn" class="btn btn-primary">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const processingContainer = document.getElementById('processingContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const errorContainer = document.getElementById('errorContainer');
        
        let currentFile = null;
        let correctedBlob = null;

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function showState(state) {
            uploadZone.classList.add('hidden');
            processingContainer.classList.add('hidden');
            resultsContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');
            
            switch(state) {
                case 'upload': uploadZone.classList.remove('hidden'); break;
                case 'processing': processingContainer.classList.remove('hidden'); break;
                case 'results': resultsContainer.classList.remove('hidden'); break;
                case 'error': errorContainer.classList.remove('hidden'); break;
            }
        }

        function setProgress(percent, step) {
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('processingStep').textContent = step;
        }

        async function processFile(file) {
            currentFile = file;
            showState('processing');
            
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            
            const formData = new FormData();
            formData.append('file', file);

            const steps = [
                { progress: 20, step: 'Extracting text...' },
                { progress: 45, step: 'Analyzing content...' },
                { progress: 70, step: 'Applying corrections...' },
                { progress: 90, step: 'Preparing document...' },
            ];
            
            let stepIndex = 0;
            const progressInterval = setInterval(() => {
                if (stepIndex < steps.length) {
                    setProgress(steps[stepIndex].progress, steps[stepIndex].step);
                    stepIndex++;
                }
            }, 700);

            try {
                const previewRes = await fetch(`${API_URL}/preview`, {
                    method: 'POST',
                    body: formData,
                });

                if (!previewRes.ok) {
                    const err = await previewRes.json();
                    throw new Error(err.detail || 'Failed to process document');
                }

                const previewData = await previewRes.json();

                const fileFormData = new FormData();
                fileFormData.append('file', file);
                
                const fileRes = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: fileFormData,
                });

                if (!fileRes.ok) {
                    const err = await fileRes.json();
                    throw new Error(err.detail || 'Failed to generate corrected file');
                }

                correctedBlob = await fileRes.blob();

                clearInterval(progressInterval);
                setProgress(100, 'Complete');
                
                setTimeout(() => showResults(previewData), 400);

            } catch (err) {
                clearInterval(progressInterval);
                showError(err.message);
            }
        }

        function showResults(data) {
            showState('results');
            
            if (data.summary) {
                document.getElementById('summaryText').textContent = data.summary;
            }

            const changesList = document.getElementById('changesList');
            changesList.innerHTML = '';
            
            if (data.changes && data.changes.length > 0) {
                changesList.innerHTML = `<div class="changes-header">${data.changes.length} Correction${data.changes.length !== 1 ? 's' : ''}</div>`;
                
                data.changes.slice(0, 10).forEach(change => {
                    const item = document.createElement('div');
                    item.className = 'change-item';
                    item.innerHTML = `
                        <span class="change-type ${change.type}">${change.type}</span>
                        <div class="change-text">
                            <span class="original">${escapeHtml(change.original)}</span>
                            <span class="arrow">→</span>
                            <span class="corrected">${escapeHtml(change.corrected)}</span>
                        </div>
                        ${change.explanation ? `<p class="change-explanation">${escapeHtml(change.explanation)}</p>` : ''}
                    `;
                    changesList.appendChild(item);
                });

                if (data.changes.length > 10) {
                    const more = document.createElement('div');
                    more.className = 'change-item';
                    more.style.textAlign = 'center';
                    more.style.color = '#888888';
                    more.textContent = `+ ${data.changes.length - 10} more corrections`;
                    changesList.appendChild(more);
                }
            }

            const maxLen = 1500;
            document.getElementById('originalPreview').textContent = 
                data.original?.slice(0, maxLen) + (data.original?.length > maxLen ? '...' : '');
            document.getElementById('correctedPreview').textContent = 
                data.corrected?.slice(0, maxLen) + (data.corrected?.length > maxLen ? '...' : '');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            showState('error');
            document.getElementById('errorMessage').textContent = message;
        }

        function reset() {
            currentFile = null;
            correctedBlob = null;
            setProgress(0, 'Starting...');
            showState('upload');
        }

        function downloadFile() {
            if (correctedBlob && currentFile) {
                const url = URL.createObjectURL(correctedBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `corrected_${currentFile.name}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }

        uploadZone.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) processFile(e.target.files[0]);
        });

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragging');
        });

        uploadZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragging');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragging');
            if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
        });

        document.getElementById('newFileBtn').addEventListener('click', reset);
        document.getElementById('downloadBtn').addEventListener('click', downloadFile);
        document.getElementById('tryAgainBtn').addEventListener('click', reset);
    </script>
</body>
</html>
