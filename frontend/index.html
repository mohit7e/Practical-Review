<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refine — Document Correction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0908;
            --bg-secondary: #121110;
            --bg-tertiary: #1a1816;
            --bg-card: #0f0e0d;
            --text-primary: #f4f0ec;
            --text-secondary: #a8a29e;
            --text-muted: #6b6560;
            --accent: #e07a5f;
            --accent-hover: #f0927a;
            --accent-soft: rgba(224, 122, 95, 0.12);
            --success: #81b29a;
            --success-soft: rgba(129, 178, 154, 0.15);
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --font-serif: 'Instrument Serif', Georgia, serif;
            --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(224, 122, 95, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(129, 178, 154, 0.04), transparent);
            pointer-events: none;
        }

        .app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
        }

        .header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 0.6s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
        }

        .logo em {
            font-style: italic;
            color: var(--accent);
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 400px;
            margin: 0 auto;
        }

        .upload-zone {
            width: 100%;
            max-width: 640px;
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: var(--radius-xl);
            padding: 4rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.3s ease;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, var(--accent-soft), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .upload-zone:hover {
            border-color: var(--accent);
            border-style: solid;
            transform: translateY(-2px);
            box-shadow: 0 0 60px rgba(224, 122, 95, 0.1);
        }

        .upload-zone:hover::before { opacity: 1; }

        .upload-zone.dragging {
            border-color: var(--accent);
            border-style: solid;
            background: var(--accent-soft);
            transform: scale(1.01);
        }

        .upload-content { position: relative; z-index: 1; }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            opacity: 0.6;
        }

        .upload-icon svg {
            width: 100%;
            height: 100%;
            stroke: var(--text-secondary);
            stroke-width: 1.5;
            fill: none;
        }

        .upload-title {
            font-family: var(--font-serif);
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .upload-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .upload-formats {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .format-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0.35rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hidden { display: none !important; }

        /* Processing */
        .processing-container {
            width: 100%;
            max-width: 640px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .processing-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 3rem 2rem;
        }

        .file-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .file-icon {
            width: 48px;
            height: 48px;
            background: var(--accent-soft);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-icon svg {
            width: 24px;
            height: 24px;
            stroke: var(--accent);
            stroke-width: 2;
            fill: none;
        }

        .file-details { text-align: left; }

        .file-name {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .file-size {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto 1.5rem;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .processing-text {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .processing-step {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .progress-container { margin-top: 1.5rem; }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .progress-bar {
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* Results */
        .results-container {
            width: 100%;
            max-width: 800px;
            animation: fadeIn 0.4s ease;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding: 0 0.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .results-title {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .success-icon {
            width: 28px;
            height: 28px;
            background: var(--success-soft);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg {
            width: 16px;
            height: 16px;
            stroke: var(--success);
            stroke-width: 2.5;
            fill: none;
        }

        .results-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .changes-summary {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .summary-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .changes-list {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .changes-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .change-item {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .change-item:last-child { border-bottom: none; }

        .change-type {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 0.75rem;
        }

        .change-type.spelling {
            background: rgba(147, 197, 253, 0.15);
            color: #93c5fd;
        }

        .change-type.grammar {
            background: rgba(253, 224, 71, 0.15);
            color: #fde047;
        }

        .change-type.factual {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        .change-text {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .original {
            color: var(--text-muted);
            text-decoration: line-through;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .arrow { color: var(--text-muted); }

        .corrected {
            color: var(--success);
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .change-explanation {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .preview-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .preview-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .preview-content {
            padding: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.8;
            color: var(--text-secondary);
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .preview-content.original-text { opacity: 0.6; }
        .preview-content.corrected-text { color: var(--text-primary); }

        /* Error */
        .error-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .error-card {
            background: var(--bg-card);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: var(--radius-xl);
            padding: 3rem 2rem;
        }

        .error-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.5rem;
            background: rgba(248, 113, 113, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-icon svg {
            width: 28px;
            height: 28px;
            stroke: #f87171;
            stroke-width: 2;
            fill: none;
        }

        .error-title {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .error-message {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        @media (max-width: 768px) {
            .app { padding: 2rem 1rem; }
            .logo { font-size: 2.5rem; }
            .upload-zone { padding: 3rem 1.5rem; }
            .preview-container { grid-template-columns: 1fr; }
            .results-header { flex-direction: column; text-align: center; }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-tertiary); }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="logo">R<em>e</em>fine</h1>
            <p class="tagline">AI-powered document correction for spelling, grammar, and factual accuracy</p>
        </header>

        <!-- Upload State -->
        <div id="uploadZone" class="upload-zone">
            <input type="file" id="fileInput" accept=".pdf,.xlsx,.docx,.txt" style="display: none;">
            <div class="upload-content">
                <div class="upload-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </div>
                <h2 class="upload-title">Drop your document</h2>
                <p class="upload-subtitle">or click to browse files</p>
                <div class="upload-formats">
                    <span class="format-badge">PDF</span>
                    <span class="format-badge">XLSX</span>
                    <span class="format-badge">DOCX</span>
                    <span class="format-badge">TXT</span>
                </div>
            </div>
        </div>

        <!-- Processing State -->
        <div id="processingContainer" class="processing-container hidden">
            <div class="processing-card">
                <div class="file-info">
                    <div class="file-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                    </div>
                    <div class="file-details">
                        <div id="fileName" class="file-name">document.pdf</div>
                        <div id="fileSize" class="file-size">0 KB</div>
                    </div>
                </div>
                <div class="spinner"></div>
                <p class="processing-text">Processing your document</p>
                <p id="processingStep" class="processing-step">Starting...</p>
                <div class="progress-container">
                    <div class="progress-label">
                        <span>Progress</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results State -->
        <div id="resultsContainer" class="results-container hidden">
            <div class="results-header">
                <h2 class="results-title">
                    <span class="success-icon">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </span>
                    Corrections Applied
                </h2>
                <div class="results-actions">
                    <button id="newFileBtn" class="btn btn-secondary">
                        <svg viewBox="0 0 24 24">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                        New File
                    </button>
                    <button id="downloadBtn" class="btn btn-primary">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download
                    </button>
                </div>
            </div>
            <div id="summarySection" class="changes-summary">
                <p id="summaryText" class="summary-text"></p>
            </div>
            <div id="changesList" class="changes-list"></div>
            <div class="preview-container">
                <div class="preview-panel">
                    <div class="preview-header">Original</div>
                    <div id="originalPreview" class="preview-content original-text"></div>
                </div>
                <div class="preview-panel">
                    <div class="preview-header">Corrected</div>
                    <div id="correctedPreview" class="preview-content corrected-text"></div>
                </div>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorContainer" class="error-container hidden">
            <div class="error-card">
                <div class="error-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <h2 class="error-title">Something went wrong</h2>
                <p id="errorMessage" class="error-message"></p>
                <button id="tryAgainBtn" class="btn btn-primary">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        // DOM Elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const processingContainer = document.getElementById('processingContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const errorContainer = document.getElementById('errorContainer');
        
        let currentFile = null;
        let correctedBlob = null;

        // Utility functions
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function showState(state) {
            uploadZone.classList.add('hidden');
            processingContainer.classList.add('hidden');
            resultsContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');
            
            switch(state) {
                case 'upload': uploadZone.classList.remove('hidden'); break;
                case 'processing': processingContainer.classList.remove('hidden'); break;
                case 'results': resultsContainer.classList.remove('hidden'); break;
                case 'error': errorContainer.classList.remove('hidden'); break;
            }
        }

        function setProgress(percent, step) {
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('processingStep').textContent = step;
        }

        // File processing
        async function processFile(file) {
            currentFile = file;
            showState('processing');
            
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            
            const formData = new FormData();
            formData.append('file', file);

            // Animate progress
            const steps = [
                { progress: 20, step: 'Extracting text...' },
                { progress: 45, step: 'Analyzing content...' },
                { progress: 70, step: 'Applying corrections...' },
                { progress: 90, step: 'Rebuilding document...' },
            ];
            
            let stepIndex = 0;
            const progressInterval = setInterval(() => {
                if (stepIndex < steps.length) {
                    setProgress(steps[stepIndex].progress, steps[stepIndex].step);
                    stepIndex++;
                }
            }, 800);

            try {
                // Get preview
                const previewRes = await fetch(`${API_URL}/preview`, {
                    method: 'POST',
                    body: formData,
                });

                if (!previewRes.ok) {
                    const err = await previewRes.json();
                    throw new Error(err.detail || 'Failed to process document');
                }

                const previewData = await previewRes.json();

                // Get corrected file
                const fileFormData = new FormData();
                fileFormData.append('file', file);
                
                const fileRes = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: fileFormData,
                });

                if (!fileRes.ok) {
                    const err = await fileRes.json();
                    throw new Error(err.detail || 'Failed to generate corrected file');
                }

                correctedBlob = await fileRes.blob();

                clearInterval(progressInterval);
                setProgress(100, 'Complete!');
                
                setTimeout(() => {
                    showResults(previewData);
                }, 500);

            } catch (err) {
                clearInterval(progressInterval);
                showError(err.message);
            }
        }

        function showResults(data) {
            showState('results');
            
            // Summary
            if (data.summary) {
                document.getElementById('summaryText').textContent = data.summary;
                document.getElementById('summarySection').classList.remove('hidden');
            }

            // Changes list
            const changesList = document.getElementById('changesList');
            changesList.innerHTML = '';
            
            if (data.changes && data.changes.length > 0) {
                changesList.innerHTML = `<div class="changes-header">${data.changes.length} Correction${data.changes.length !== 1 ? 's' : ''} Made</div>`;
                
                data.changes.slice(0, 10).forEach(change => {
                    const item = document.createElement('div');
                    item.className = 'change-item';
                    item.innerHTML = `
                        <span class="change-type ${change.type}">${change.type}</span>
                        <div class="change-text">
                            <span class="original">${escapeHtml(change.original)}</span>
                            <span class="arrow">→</span>
                            <span class="corrected">${escapeHtml(change.corrected)}</span>
                        </div>
                        ${change.explanation ? `<p class="change-explanation">${escapeHtml(change.explanation)}</p>` : ''}
                    `;
                    changesList.appendChild(item);
                });

                if (data.changes.length > 10) {
                    const more = document.createElement('div');
                    more.className = 'change-item';
                    more.style.textAlign = 'center';
                    more.style.color = 'var(--text-muted)';
                    more.textContent = `+ ${data.changes.length - 10} more corrections`;
                    changesList.appendChild(more);
                }
            }

            // Preview
            const maxLen = 2000;
            document.getElementById('originalPreview').textContent = 
                data.original?.slice(0, maxLen) + (data.original?.length > maxLen ? '...' : '');
            document.getElementById('correctedPreview').textContent = 
                data.corrected?.slice(0, maxLen) + (data.corrected?.length > maxLen ? '...' : '');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            showState('error');
            document.getElementById('errorMessage').textContent = message;
        }

        function reset() {
            currentFile = null;
            correctedBlob = null;
            setProgress(0, 'Starting...');
            showState('upload');
        }

        function downloadFile() {
            if (correctedBlob && currentFile) {
                const url = URL.createObjectURL(correctedBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `corrected_${currentFile.name}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }

        // Event listeners
        uploadZone.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                processFile(e.target.files[0]);
            }
        });

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragging');
        });

        uploadZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragging');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragging');
            if (e.dataTransfer.files[0]) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        document.getElementById('newFileBtn').addEventListener('click', reset);
        document.getElementById('downloadBtn').addEventListener('click', downloadFile);
        document.getElementById('tryAgainBtn').addEventListener('click', reset);
    </script>
</body>
</html>
